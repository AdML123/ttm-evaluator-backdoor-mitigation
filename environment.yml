name: paper20-cu128
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.10
  - pip
  - pyyaml>=6.0
  # laion-clap 1.1.7 and the current audio stack are validated with NumPy 1.26.
  - numpy>=1.26,<2.0
  - scipy>=1.12
  - pandas>=2.2
  - scikit-learn>=1.4
  - matplotlib>=3.8
  - seaborn>=0.13
  - soundfile>=0.12
  - pytest>=8.0
  - pip:
      - accelerate>=0.30
      - datasets>=2.18
      - librosa>=0.10.2
      - laion-clap>=1.1.7
      - statsmodels>=0.14
      - transformers>=4.51.3,<5
      - huggingface-hub>=0.24

# The existing paper20-cu128 environment supplies the pinned PyTorch/CUDA
# runtime. Capture its exact package list with `conda list --explicit` before
# a release instead of replacing the working CUDA build from this file.
